# XcodeGen spec used only by CI to run the app in the iOS Simulator.
name: LinguAlyzer
options:
  bundleIdPrefix: dev.lingualyzer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    SWIFT_VERSION: "5.0"
targets:
  LinguAlyzer:
    type: application
    platform: iOS
    sources:
      - path: ${APP_SOURCES}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lingualyzer.app
        SWIFT_VERSION: ${APP_SWIFT_VERSION}
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  LinguAlyzerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LinguAlyzer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lingualyzer.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: LinguAlyzer
schemes:
  LinguAlyzer:
    build:
      targets:
        LinguAlyzer: all
    test:
      targets:
        - LinguAlyzerUITests
