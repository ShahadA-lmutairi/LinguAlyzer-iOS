name: iOS tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.device }}, Swift ${{ matrix.swift }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
        swift: ["5.0", "6.0"]
    env:
      APP_SWIFT_VERSION: ${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4

      - name: Point the project at the app sources
        run: echo "APP_SOURCES=$GITHUB_WORKSPACE/Sources" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ci && xcodegen generate

      - name: Run unit and UI tests in the iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          prefix = sys.argv[1]
          for runtime, devs in json.load(sys.stdin)["devices"].items():
              if "iOS" not in runtime: continue
              for d in devs:
                  if d["name"].startswith(prefix):
                      print(d["udid"], file=sys.stdout); print(d["name"], runtime, file=sys.stderr); sys.exit(0)
          sys.exit(1)' "${{ matrix.device }}")
          cd ci
          set -o pipefail
          xcodebuild test \
            -project LinguAlyzer.xcodeproj \
            -scheme LinguAlyzer \
            -destination "id=$UDID" \
            | tail -120
